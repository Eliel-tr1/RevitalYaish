<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f4">
<meta name="robots" content="noindex,nofollow">
<title>לוח בקרה · רויטל יעיש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FF004F'/%3E%3Cpath d='M18 40c8-2 12-8 12-16 6 4 10 10 10 16' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ===== tokens ===== */
:root{
  --brand:#FF004F; --brand-2:#FF5C8A;
  --bg:#0d0f13; --card:#16181c; --card-2:#1d2027; --line:rgba(255,255,255,.09);
  --ink:#fff; --ink-2:#b9bdc6; --ink-3:#7d828d; --grid:#24272d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
}
html[data-theme="light"]{
  --bg:#f5f6f4; --card:#fff; --card-2:#f7f8f6; --line:rgba(11,11,11,.11);
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#84837e; --grid:#e6e7e3;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.hide{display:none!important}
button,select,input{font-family:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ===== login ===== */
#login{position:fixed;inset:0;z-index:100;background:radial-gradient(1200px 700px at 70% -10%,rgba(255,0,79,.16),transparent 60%),var(--bg);display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 28px;text-align:center}
.lbox .logo{justify-content:center;margin-bottom:22px}
.lbox p{color:var(--ink-3);font-size:13.5px;margin:0 0 20px}
.lbox input{width:100%;background:var(--card-2);border:1px solid var(--line);color:var(--ink);padding:13px 15px;border-radius:12px;font-size:15px;text-align:center;letter-spacing:2px}
.lbox button{width:100%;margin-top:12px;background:linear-gradient(135deg,var(--brand),#c9003e);border:0;color:#fff;font-weight:700;font-size:15px;padding:13px;border-radius:12px;cursor:pointer}
.lmsg{min-height:20px;font-size:13px;color:var(--ink-3);margin-top:12px}
.lmsg.bad{color:#ff9a9a}
.editsel{width:100%;background:var(--card-2);border:1px solid var(--line);color:var(--ink);padding:5px 7px;border-radius:8px;font-size:12.5px;cursor:pointer}
.flagrow{background:rgba(208,59,59,.08)}
.admin-gate{grid-column:span 12;max-width:380px;margin:16px auto}
.admin-bulk{display:none;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:12.5px}
.admin-bulk.on{display:flex}
.admin-bulk select{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:6px 9px;border-radius:8px;font-size:12.5px}
th.chkcol,td.chkcol{width:28px;text-align:center}
th.sortable{cursor:pointer;user-select:none}
.panel.collapsible>summary{cursor:pointer;font-size:14.5px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
.panel.collapsible>summary::-webkit-details-marker{display:none}
.panel.collapsible>summary::before{content:"◂";color:var(--ink-3);font-size:12px}
.panel.collapsible[open]>summary::before{content:"▾"}
.panel.collapsible[open]>summary{margin-bottom:8px}
th.sortable:hover{color:var(--brand)}
.tab-lock{font-size:10px;opacity:.7;margin-inline-end:2px}

/* ===== brand mark ===== */
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:16.5px;letter-spacing:-.3px;white-space:nowrap}
.logo .mark{width:38px;height:38px;border-radius:12px;background:#14161b;display:grid;place-items:center;flex:none}
.logo .mark svg{width:22px;height:22px;display:block}
.logo small{display:block;font-weight:400;font-size:11px;color:var(--ink-3);letter-spacing:0;margin-top:1px}

/* ===== top bar ===== */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1600px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
#navWrap{flex:1;min-width:0}
nav{display:flex;gap:3px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--ink-3);font:500 14px Heebo;padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.14s}
nav button:hover{color:var(--ink);background:var(--card-2)}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--brand),#d10041)}
html[data-theme="light"] nav button.on{color:#fff}
.sync{display:flex;align-items:center;gap:9px;margin-inline-start:auto}
.stamp{font-size:11.5px;color:var(--ink-3);text-align:left;line-height:1.35;white-space:nowrap}
.stamp b{display:block;color:var(--ink-2);font-weight:500;font-size:12.5px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--ink);font:500 13px Heebo;padding:8px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:linear-gradient(135deg,var(--brand),#d10041);border-color:transparent;color:#fff;font-weight:600}
.btn:disabled{opacity:.65;cursor:wait}
.icon-btn{width:38px;height:38px;justify-content:center;padding:0;font-size:15px}
#menuBtn,#filtBtn{display:none}
.sp{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
.sp.sm{width:12px;height:12px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:12px;justify-content:center;padding:70px 20px;color:var(--ink-3);font-size:14px}
.loading .sp{border-color:var(--line);border-top-color:var(--brand);width:20px;height:20px}

.wrap{max-width:1600px;margin:0 auto;padding:0 18px 60px}

/* ===== filters ===== */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin:16px 0 0;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.fgroup{display:flex;flex-direction:column;min-width:0}
.fgroup label{font-size:11px;color:var(--ink-3);margin-bottom:4px}
select,input[type=date]{background:var(--card-2);border:1px solid var(--line);color:var(--ink);font:400 13px Heebo;padding:7px 10px;border-radius:8px;min-width:130px;max-width:190px}
.seg{display:flex;background:var(--card-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--ink-3);font:500 12.5px Heebo;padding:7px 11px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--brand);color:#fff}
.inline-sel{min-width:150px;max-width:100%}


/* מסנן שלא רלוונטי ללוח הנוכחי */
.fgroup.off,.seg.off{opacity:.34;pointer-events:none;filter:saturate(.4)}
.fgroup.off select,.fgroup.off input{cursor:not-allowed}
#customRange.off{opacity:.34;pointer-events:none}


/* ===== sync panel ===== */
#syncPanel{margin-top:22px}
#syncPanel details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px}
#syncPanel summary{cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500;list-style:none}
#syncPanel summary::-webkit-details-marker{display:none}
#syncPanel summary::before{content:"▸ ";color:var(--brand)}
#syncPanel details[open] summary::before{content:"▾ "}
.syncgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px 14px;margin:14px 0;font-size:12px;color:var(--ink-3)}
.syncgrid b{color:var(--ink);font-variant-numeric:tabular-nums}
.syncgrid i{opacity:.55;font-style:normal;font-size:10.5px}
.muted{color:var(--ink-3);font-size:11.5px}
/* רמז גלילה אופקית בטבלאות צרות */
.tw{position:relative}
.tw::after{content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:26px;pointer-events:none;
  background:linear-gradient(to right,var(--card),transparent);opacity:0;transition:.2s}
@media(max-width:860px){.tw::after{opacity:.9}}


/* ===== nav numbers ===== */
nav button b{display:inline-block;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:5px;
  background:var(--card-2);color:var(--ink-3);font-size:10.5px;font-weight:700;margin-inline-end:6px;vertical-align:1px}
nav button.on b{background:rgba(255,255,255,.24);color:#fff}

/* ===== multi select ===== */
.slots{display:contents}
.ms{position:relative}
.ms-btn{display:flex;align-items:center;gap:6px;justify-content:space-between;min-width:150px;max-width:210px;
  background:var(--card-2);border:1px solid var(--line);color:var(--ink);font:400 13px Heebo;padding:7px 10px;border-radius:8px;cursor:pointer}
.ms.active .ms-btn{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.ms-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-car{color:var(--ink-3);font-size:10px;flex:none}
.ms-pop{position:absolute;z-index:60;top:calc(100% + 6px);inset-inline-start:0;min-width:236px;max-width:300px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.42)}
.ms-search{width:100%;background:var(--card-2);border:1px solid var(--line);color:var(--ink);
  font:400 13px Heebo;padding:7px 9px;border-radius:8px;margin-bottom:6px}
.ms-list{max-height:236px;overflow-y:auto}
.ms-item{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:7px;cursor:pointer;font-size:13px}
.ms-item:hover{background:var(--card-2)}
.ms-item input{accent-color:var(--brand);width:15px;height:15px;flex:none}
.ms-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-none{padding:12px;color:var(--ink-3);font-size:12.5px;text-align:center}
.ms-foot{display:flex;gap:6px;margin-top:7px;border-top:1px solid var(--line);padding-top:7px}
.ms-foot button{flex:1;background:var(--card-2);border:1px solid var(--line);color:var(--ink-2);
  font:500 12.5px Heebo;padding:6px;border-radius:7px;cursor:pointer}
.ms-foot button:hover{border-color:var(--brand);color:var(--ink)}

/* ===== client card ===== */
.cl-search{width:100%;max-width:280px;background:var(--card-2);border:1px solid var(--line);color:var(--ink);
  font:400 13px Heebo;padding:7px 10px;border-radius:8px;margin-inline-end:8px}
.client{background:var(--card-2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:12px}
.cl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.cl-head b{font-size:16px}
.cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px 14px}
.cl-grid span{display:flex;flex-direction:column;gap:2px;min-width:0}
.cl-grid i{font-style:normal;font-size:11px;color:var(--ink-3)}
.cl-grid b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== page head ===== */
h2.page{font-size:20px;font-weight:800;margin:20px 0 0;letter-spacing:-.4px;line-height:1.35}
h2.page span{display:block;font-size:12.5px;font-weight:400;color:var(--ink-3);margin-top:5px;letter-spacing:0}
h2.page code,.sub code{background:var(--card-2);padding:1px 5px;border-radius:4px;font-size:.86em;color:var(--ink-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;direction:ltr;display:inline-block}

/* ===== flags ===== */
.flags{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:14px}
.flag{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:11px;font-size:13.5px;border:1px solid}
.flag .ic{font-size:11px}
.flag .n{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.flag small{display:block;opacity:.8;font-size:11.5px;margin-top:2px}
.flag.crit{background:rgba(208,59,59,.11);border-color:rgba(208,59,59,.4);color:#ffb0b0}
.flag.warn{background:rgba(250,178,25,.11);border-color:rgba(250,178,25,.4);color:#ffd980}
.flag.ok{background:rgba(12,163,12,.10);border-color:rgba(12,163,12,.32);color:#8fe08f}
html[data-theme="light"] .flag.crit{color:#8e1f1f}
html[data-theme="light"] .flag.warn{color:#7a5400}
html[data-theme="light"] .flag.ok{color:#0b6b0b}

/* ===== kpi ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;transition:.14s}
.kpi:hover{border-color:color-mix(in srgb,var(--brand) 55%,var(--line))}
.kpi .t{font-size:12.5px;color:var(--ink-3);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi .v{font-size:29px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.kpi .v .u{font-size:14px;font-weight:500;color:var(--ink-3);margin-inline-start:3px}
.kpi .d{font-size:12px;margin-top:7px}
.kpi-breakdown{display:flex;flex-direction:column;gap:3px;color:var(--ink-2)}
.kpi.empty .v{color:var(--ink-3);font-size:16px;font-weight:500;letter-spacing:0}
.cf-current{display:flex;gap:18px;flex-wrap:wrap}
.cf-stat{display:flex;flex-direction:column;gap:2px}
.cf-stat b{font-size:20px;font-weight:800}
.cf-stat span{font-size:11.5px;color:var(--ink-3)}
.up{color:var(--good)}.down{color:var(--crit)}.flat{color:var(--ink-3)}
html[data-theme="light"] .up{color:#046b04}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600}
.badge.blocked{background:rgba(208,59,59,.18);color:#ff9a9a}
.badge.live{background:rgba(12,163,12,.16);color:#7fd77f}
html[data-theme="light"] .badge.blocked{color:#a01f1f}
html[data-theme="light"] .badge.live{color:#0b6b0b}

/* ===== panels ===== */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;grid-column:span 6;min-width:0}
.panel.w4{grid-column:span 4}.panel.w5{grid-column:span 5}.panel.w6{grid-column:span 6}
.panel.w7{grid-column:span 7}.panel.w8{grid-column:span 8}.panel.w12{grid-column:span 12}
.panel h3{margin:0 0 3px;font-size:14.5px;font-weight:600}
.panel .sub{font-size:11.5px;color:var(--ink-3);margin-bottom:13px}
.chart{position:relative;height:225px}
.chart.tall{height:280px}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:11px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:block;flex:none}

/* ===== tables ===== */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:right;font-weight:500;color:var(--ink-3);font-size:11.5px;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card-2)}
tbody tr[data-fb]{cursor:pointer}
.pill{font-size:11px;padding:2px 9px;border-radius:20px;white-space:nowrap;background:var(--card-2);color:var(--ink-2);display:inline-block}
.pill.ok{background:rgba(12,163,12,.16);color:#7fd77f}
.pill.warn{background:rgba(250,178,25,.16);color:#ffd980}
.pill.crit{background:rgba(208,59,59,.16);color:#ff9a9a}
html[data-theme="light"] .pill.ok{color:#0b6b0b}
html[data-theme="light"] .pill.warn{color:#7a5400}
html[data-theme="light"] .pill.crit{color:#a01f1f}
.bar-cell{position:relative;height:7px;background:var(--card-2);border-radius:4px;overflow:hidden;min-width:64px}
.bar-cell i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:4px;display:block}

.empty-box{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13px;border:1px dashed var(--line);border-radius:12px;line-height:1.7}
.empty-box b{display:block;color:var(--ink-2);font-size:14.5px;margin-bottom:6px}

footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* ===== responsive ===== */
@media(max-width:1180px){
  .panel,.panel.w4,.panel.w5,.panel.w6,.panel.w7,.panel.w8{grid-column:span 12}
}
@media(max-width:860px){
  .top-in{flex-wrap:wrap;gap:10px;padding:9px 14px}
  #menuBtn,#filtBtn{display:inline-flex}
  #navWrap{order:5;flex-basis:100%;display:none}
  #navWrap.open{display:block}
  nav{flex-direction:column;gap:2px;padding-bottom:6px}
  nav button{text-align:right;width:100%;padding:11px 13px;font-size:15px}
  .sync{margin-inline-start:auto;gap:7px}
  .stamp{display:none}
  .wrap{padding:0 14px 50px}
  .filters{display:none}
  .filters.open{display:flex}
  .ms-btn{max-width:none;width:100%}
  .ms-pop{position:fixed;inset-inline:14px;top:auto;max-width:none;min-width:0}
  .cl-search{max-width:none}
  select,input[type=date]{max-width:none;flex:1}
  .fgroup{flex:1 1 150px}
  .seg{width:100%}
  .seg button{flex:1;padding:9px 6px}
  h2.page{font-size:18px;margin-top:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kpi{padding:13px 14px;border-radius:14px}
  .kpi .v{font-size:25px}
  .flags{grid-template-columns:1fr}
  .chart{height:210px}
  .chart.tall{height:230px}
  .panel{padding:14px 14px;border-radius:14px}
  footer{font-size:10.5px}
}
@media(max-width:420px){
  .logo{font-size:14.5px}
  .logo .mark{width:32px;height:32px;border-radius:10px}
  .logo .mark svg{width:19px;height:19px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:22px}
}
</style>
</head>
<body>

<!-- ====== מסך כניסה ====== -->

<script>/* ============================================================
   דשבורד רויטל יעיש
   מקור נתונים: dash-api (Supabase). אין טוקן פיירברי בדפדפן.
   כלל עריכה: אסור מקף ארוך בשום מחרוזת בקובץ הזה.
   ============================================================ */
const API = "https://klobimzmuurzbimfkubr.supabase.co/functions/v1/dash-api";
const EMPTY = "לא הוזן";

const ST = {
  token: sessionStorage.getItem("rv_token") || "",
  data: null,
  tab: "sales",
  theme: localStorage.getItem("rv_theme") || "light",
  f: { range: "week", from: "", to: "", mentor: [], product: [], source: [], cycle: [], program: [], group: [] },
  drill: null,
  clientQ: "",
  adminToken: sessionStorage.getItem("rv_admin_token") || "",
};
let charts = [];

/* ---------- utils ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
/* esc: בריחת HTML + נורמליזציה של מקפים ארוכים שמגיעים מהדאטה של פיירברי.
   דרישת מייק: מקף ארוך לא מופיע בשום מקום בדשבורד, גם לא בשמות רשומות. */
const esc = (s) => String(s ?? "").replace(/[\u2014\u2013\u2012\u2015]/g, "\u00b7").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (n, d = 0) => (n === null || n === undefined || !isFinite(n) ? EMPTY : Number(n).toLocaleString("he-IL", { minimumFractionDigits: d, maximumFractionDigits: d }));
const pct = (n, d = 1) => (n === null || n === undefined || !isFinite(n) ? EMPTY : Number(n).toFixed(d));
const ils = (n) => (n === null || !isFinite(n) ? EMPTY : "₪ " + Number(n).toLocaleString("he-IL", { maximumFractionDigits: 0 }));
const dOnly = (s) => (s ? String(s).slice(0, 10) : null);
const heDate = (s) => { const d = dOnly(s); return d ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : EMPTY; };
const heShort = (s) => { const d = dOnly(s); return d ? d.slice(8, 10) + "/" + d.slice(5, 7) : EMPTY; };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const todayISO = () => new Date().toISOString().slice(0, 10);
const addDays = (iso, n) => new Date(new Date(iso).getTime() + n * 86400000).toISOString().slice(0, 10);
const uniq = (a) => [...new Set(a.filter((x) => x !== null && x !== undefined && x !== ""))].sort((x, y) => String(x).localeCompare(String(y), "he"));
const cnt = (a, f) => a.reduce((s, x) => s + (f(x) ? 1 : 0), 0);
const sum = (a, f) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const avg = (a, f) => { const v = a.map(f).filter((x) => x !== null && x !== undefined && isFinite(x)); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const groupCount = (a, f) => { const m = new Map(); a.forEach((x) => { const k = f(x); if (k === null || k === undefined || k === "") return; m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((p, q) => q[1] - p[1]); };
const trunc = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const cssv = (n) => getComputedStyle(document.body).getPropertyValue(n).trim();
const S8 = () => ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"].map(cssv);

/* ---------- api ---------- */
async function api(action, extra) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", "x-dash-token": ST.token }, body: JSON.stringify(Object.assign({ action }, extra || {})) });
  const j = await r.json().catch(() => ({ error: "bad_json" }));
  if (r.status === 401) { logout(); throw new Error("unauthorized"); }
  return j;
}

/* ---------- auth ---------- */
async function login(pw) {
  const msg = $("#loginMsg"); msg.textContent = "בודק…"; msg.className = "lmsg";
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "login", password: pw }) });
    const j = await r.json();
    if (!j.token) { msg.textContent = "סיסמה שגויה"; msg.className = "lmsg bad"; return; }
    ST.token = j.token; sessionStorage.setItem("rv_token", j.token);
    msg.textContent = ""; $("#login").classList.add("hide"); boot();
  } catch (e) { msg.textContent = "שגיאת רשת, נסה שוב"; msg.className = "lmsg bad"; }
}
function logout() { snapClear(); sessionStorage.removeItem("rv_token"); ST.token = ""; $("#login").classList.remove("hide"); $("#app").classList.add("hide"); }

/* ---------- admin (בקרת נציגים) ---------- */
let adminSel = new Set();
let adminLastChkIdx = null;
let adminSort = { key: "name", dir: 1 };
async function adminApi(action, extra) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", "x-admin-token": ST.adminToken }, body: JSON.stringify(Object.assign({ action }, extra || {})) });
  const j = await r.json().catch(() => ({ error: "bad_json" }));
  if (r.status === 401) { adminLogout(); throw new Error("unauthorized"); }
  return j;
}
async function adminLogin(pw) {
  const msg = $("#adminMsg"); if (msg) { msg.textContent = "בודק…"; msg.className = "lmsg"; }
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "admin_login", password: pw }) });
    const j = await r.json();
    if (!j.admin_token) { if (msg) { msg.textContent = "סיסמה שגויה"; msg.className = "lmsg bad"; } return; }
    ST.adminToken = j.admin_token; sessionStorage.setItem("rv_admin_token", j.admin_token);
    render();
  } catch (e) { if (msg) { msg.textContent = "שגיאת רשת, נסה שוב"; msg.className = "lmsg bad"; } }
}
function adminLogout() { sessionStorage.removeItem("rv_admin_token"); ST.adminToken = ""; adminSel = new Set(); render(); }

/* ---------- טעינת נתונים: תמונת מצב מוכנה + מטמון בדפדפן ----------
   השרת בונה אחרי כל סנכרון קובץ דחוס של כל הנתונים. הדפדפן שומר את העותק האחרון,
   ומוריד מחדש רק כשהגרסה בשרת השתנתה. עריכות מלוח 6 שנעשו אחרי הבנייה מגיעות כ-patch.
   אם משהו חסר, נופלים לטעינה החיה הישנה. */
const SNAP_DB = "rv_dash_cache", SNAP_STORE = "snap";
function snapDb() { return new Promise((res, rej) => { const r = indexedDB.open(SNAP_DB, 1); r.onupgradeneeded = () => r.result.createObjectStore(SNAP_STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function snapGet() { try { const db = await snapDb(); return await new Promise((res) => { const q = db.transaction(SNAP_STORE).objectStore(SNAP_STORE).get("snapshot"); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } }
async function snapPut(v) { try { const db = await snapDb(); await new Promise((res) => { const t = db.transaction(SNAP_STORE, "readwrite"); t.objectStore(SNAP_STORE).put(v, "snapshot"); t.oncomplete = res; t.onerror = res; }); } catch (e) { } }
function snapClear() { try { indexedDB.deleteDatabase(SNAP_DB); } catch (e) { } }
async function gunzipJSON(buf) { const st = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip")); return JSON.parse(await new Response(st).text()); }
function decodeSnap(d) {
  for (const k of d.compact || []) {
    const t = d[k]; if (!t || !t.c || !t.r) continue;
    d[k] = t.r.map((row) => { const o = {}; for (let i = 0; i < t.c.length; i++) o[t.c[i]] = row[i]; return o; });
  }
  return d;
}
function applyPatch(d, patch) {
  const rows = (patch && patch.coaching) || []; if (!rows.length) return d;
  const byId = new Map(rows.map((r) => [r.id, r]));
  d.coaching = d.coaching.map((c) => (byId.has(c.id) ? Object.assign({}, c, byId.get(c.id)) : c));
  return d;
}
async function loadData() {
  if (typeof DecompressionStream === "undefined") return api("data");
  const cached = await snapGet();
  const meta = await api("data", { mode: "snapshot", have: cached ? cached.version : null });
  if (meta && meta.opps) return meta;
  if (!meta || meta.error || (!meta.url && !meta.unchanged)) return api("data");
  let buf;
  if (meta.unchanged && cached) buf = cached.buf;
  else {
    const r = await fetch(meta.url);
    if (!r.ok) return api("data");
    buf = await r.arrayBuffer();
    snapPut({ version: meta.version, buf });
  }
  try { return applyPatch(decodeSnap(await gunzipJSON(buf)), meta.patch); }
  catch (e) { snapClear(); return api("data"); }
}

/* ---------- boot ---------- */
async function boot() {
  $("#app").classList.remove("hide");
  $("#view").innerHTML = '<div class="loading"><div class="sp"></div>טוען נתונים מהמחסן…</div>';
  readUrl();
  try {
    const d = await loadData();
    if (d.error) { $("#view").innerHTML = '<div class="empty-box"><b>שגיאה בטעינת הנתונים</b>' + esc(d.error) + "</div>"; return; }
    ST.data = d;
    buildFilters(); renderStamp(); renderSyncPanel(); render();
  } catch (e) { /* handled */ }
}

function renderSyncPanel() {
  const st = (ST.data.sync.state || []).slice().sort((a, b) => (b.record_count || 0) - (a.record_count || 0));
  const lg = ST.data.sync.log || [];
  const el = $("#syncPanel"); if (!el) return;
  el.innerHTML = '<details><summary>מצב הסנכרון · ' + st.length + " אובייקטים · " + num(st.reduce((a, x) => a + (x.record_count || 0), 0)) + " רשומות במחסן</summary>" +
    '<div class="syncgrid">' + st.map((x) => "<span><b>" + num(x.record_count) + "</b> " + esc(x.object_label) + " <i>(" + x.object_type + ")</i></span>").join("") + "</div>" +
    '<div class="tw"><table><thead><tr><th>התחלה</th><th>סוג</th><th>קריאות API</th><th>רשומות</th><th>סטטוס</th></tr></thead><tbody>' +
    lg.map((l) => "<tr><td>" + heDate(l.started_at) + " " + String(l.started_at).slice(11, 16) + "</td><td>" + esc(l.trigger_type) + "</td><td>" + num(l.api_calls) + "</td><td>" + num(l.records_upserted) + '</td><td><span class="pill ' + (l.status === "ok" ? "ok" : "crit") + '">' + (l.status === "ok" ? "תקין" : esc(l.error || "שגיאה")) + "</span></td></tr>").join("") +
    "</tbody></table></div></details>";
}
function renderStamp() {
  const lg = (ST.data.sync.log || [])[0]; const el = $("#stamp");
  if (!lg) { el.innerHTML = "<b>לא סונכרן</b>אין יומן"; return; }
  const mins = Math.round((Date.now() - new Date(lg.finished_at || lg.started_at)) / 60000);
  const ago = mins < 1 ? "לפני רגע" : mins < 60 ? "לפני " + mins + " דק׳" : "לפני " + Math.round(mins / 60) + " שעות";
  el.innerHTML = "<b>עודכן " + ago + "</b>" + lg.api_calls + " קריאות API · " + (lg.status === "ok" ? "תקין" : "שגיאה");
}

/* ---------- url ---------- */
const MULTI = ["mentor", "product", "source", "cycle", "program", "group"];
function readUrl() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("tab")) ST.tab = p.get("tab");
  ["range", "from", "to"].forEach((k) => { if (p.get(k) !== null) ST.f[k] = p.get(k); });
  MULTI.forEach((k) => { const v = p.get(k); ST.f[k] = v ? v.split("~").filter(Boolean) : []; });
  if (p.get("q")) ST.clientQ = p.get("q");
  if (p.get("range") === null) { if (ST.tab === "coach") ST.f.range = "month"; if (ST.tab === "admin") ST.f.range = "all"; }
}
let _lastHash = "";
function writeUrl() {
  const p = new URLSearchParams(); p.set("tab", ST.tab);
  ["range", "from", "to"].forEach((k) => { if (ST.f[k]) p.set(k, ST.f[k]); });
  MULTI.forEach((k) => { if (ST.f[k].length) p.set(k, ST.f[k].join("~")); });
  if (ST.clientQ) p.set("q", ST.clientQ);
  _lastHash = p.toString(); history.replaceState(null, "", "#" + _lastHash);
}

/* ---------- date range ---------- */
function rangeBounds() {
  const f = ST.f;
  if (f.range === "custom" && f.from && f.to) return [f.from, f.to];
  if (f.range === "all") return ["1900-01-01", "2999-12-31"];
  if (f.range === "today") return [todayISO(), todayISO()];
  if (f.range === "week") { const dow = new Date().getDay(); return [addDays(todayISO(), -dow), todayISO()]; }
  if (f.range === "month") return [todayISO().slice(0, 8) + "01", todayISO()];
  const n = parseInt(f.range, 10) || 90;
  return [addDays(todayISO(), -n + 1), todayISO()];
}
function prevBounds() { const [a, b] = rangeBounds(); const len = daysBetween(a, b) + 1; return [addDays(a, -len), addDays(a, -1)]; }
const inR = (d, b) => { const x = dOnly(d); return !!x && x >= b[0] && x <= b[1]; };

/* ============================================================
   מסננים מרובי בחירה
   ============================================================ */
const FILTERS = [
  { key: "mentor", label: "מנטורית / נציגה", all: "כל המנטוריות" },
  { key: "product", label: "מוצר", all: "כל המוצרים" },
  { key: "source", label: "מקור הגעה", all: "כל המקורות" },
  { key: "cycle", label: "מחזור בוסט", all: "כל המחזורים" },
  { key: "program", label: "תוכנית", all: "כל התוכניות" },
  { key: "group", label: "קבוצת וואטסאפ", all: "כל הקבוצות" },
];
const PROGRAMS = [["1", "בוסט"], ["2", "פרימיום"], ["3", "מתקדמים"], ["4", "המשך"]];

function filterOptions(key) {
  const d = ST.data;
  if (key === "mentor") return uniq([...d.opps.map((o) => o.ownername), ...d.coaching.map((c) => c.ownername)]).map((v) => [v, v]);
  if (key === "product") return uniq(d.products.map((p) => p.name)).map((v) => [v, v]);
  if (key === "source") return uniq([...d.sources.map((s) => s.name), ...d.opps.map((o) => o.utm_source_name)]).map((v) => [v, v]);
  if (key === "cycle") return [...d.cycles].sort((a, b) => String(a.start_date).localeCompare(String(b.start_date))).map((c) => c.name).filter((v, i, arr) => arr.indexOf(v) === i).map((v) => [v, v]);
  if (key === "program") return PROGRAMS;
  if (key === "group") return uniq(d.coaching.map((c) => c.group_name)).map((v) => [v, v]);
  return [];
}

function buildFilters() {
  $("#filterSlots").innerHTML = FILTERS.map((f) =>
    '<div class="fgroup" data-key="' + f.key + '"><label>' + f.label + "</label>" +
    '<div class="ms" data-key="' + f.key + '">' +
    '<button type="button" class="ms-btn" aria-haspopup="listbox"><span class="ms-txt">' + f.all + '</span><span class="ms-car">▾</span></button>' +
    '<div class="ms-pop" hidden><input class="ms-search" type="text" placeholder="חיפוש…" aria-label="חיפוש"><div class="ms-list"></div>' +
    '<div class="ms-foot"><button type="button" class="ms-clear">נקה</button><button type="button" class="ms-close">סגור</button></div></div></div></div>').join("");
  FILTERS.forEach((f) => paintMs(f.key));
  $$("#rangeSeg button").forEach((b) => b.classList.toggle("on", b.dataset.r === ST.f.range));
  $("#customRange").classList.toggle("hide", ST.f.range !== "custom");
  $("#fFrom").value = ST.f.from; $("#fTo").value = ST.f.to;
}

function paintMs(key) {
  const wrap = $('.ms[data-key="' + key + '"]'); if (!wrap) return;
  const meta = FILTERS.find((f) => f.key === key);
  const opts = filterOptions(key);
  const sel = ST.f[key];
  const q = ($(".ms-search", wrap) || {}).value || "";
  $(".ms-list", wrap).innerHTML = opts.filter(([v, l]) => !q || String(l).includes(q))

function wireMs() {

    const btn = e.target.closest(".ms-btn");
    if (btn) {
      const pop = btn.parentElement.querySelector(".ms-pop");
      const open = !pop.hidden;
      $$(".ms-pop").forEach((p) => (p.hidden = true));
      pop.hidden = open;
      if (!open) { const s = pop.querySelector(".ms-search"); s.value = ""; paintMs(btn.parentElement.dataset.key); s.focus(); }
      return;
    }
    if (e.target.closest(".ms-close")) { e.target.closest(".ms-pop").hidden = true; return; }
    const clr = e.target.closest(".ms-clear");
    if (clr) { const k = clr.closest(".ms").dataset.key; ST.f[k] = []; paintMs(k); render(); return; }
    if (!e.target.closest(".ms")) $$(".ms-pop").forEach((p) => (p.hidden = true));
  });
  document.addEventListener("change", (e) => {
    const cb = e.target.closest(".ms-item input"); if (!cb) return;
    const k = cb.closest(".ms").dataset.key; const v = cb.value;
    ST.f[k] = cb.checked ? [...ST.f[k], v] : ST.f[k].filter((x) => x !== v);
    paintMs(k); ST.drill = null; render();
  });
  document.addEventListener("input", (e) => { if (e.target.closest(".ms-search")) paintMs(e.target.closest(".ms").dataset.key); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $$(".ms-pop").forEach((p) => (p.hidden = true)); });
}

/* ---------- slicing ---------- */
const anyOf = (arr, v) => !arr.length || arr.includes(String(v));

function slice(bounds) {
  const d = ST.data, f = ST.f, b = bounds || rangeBounds();
  const opps = d.opps.filter((x) => inR(x.createdon, b) && anyOf(f.source, x.utm_source_name) && anyOf(f.product, x.product_name) && anyOf(f.mentor, x.ownername) && anyOf(f.cycle, x.cycle_name));
  const coaching = d.coaching.filter((x) => anyOf(f.mentor, x.ownername) && anyOf(f.product, x.product_name) && anyOf(f.program, x.program) && anyOf(f.cycle, x.cycle_name));
  const cIds = new Set(coaching.map((c) => c.id));
  const weighins = d.weighins.filter((w) => !w.coaching_id || cIds.has(w.coaching_id));
  const cycles = d.cycles.filter((c) => anyOf(f.cycle, c.name) && anyOf(f.product, c.product_name));
  return { opps, coaching, weighins, cycles, menus: d.menus, b };
}

function firstOppsPerCustomer(d) {
  const map = new Map(); const noAccount = [];
  for (const o of d.opps) {
    if (!o.account_id) { noAccount.push(o); continue; }
    const cur = map.get(o.account_id);
    if (!cur || String(o.createdon) < String(cur.createdon)) map.set(o.account_id, o);
  }
  return [...map.values(), ...noAccount];
}
function wonByPayment(bounds) {
  const d = ST.data, f = ST.f, b = bounds || rangeBounds();
  const oppOk = (o) => anyOf(f.source, o.utm_source_name) && anyOf(f.product, o.product_name) && anyOf(f.mentor, o.ownername) && anyOf(f.cycle, o.cycle_name);
  const oppById = new Map(d.opps.filter(oppOk).map((o) => [o.id, o]));
  const payments = d.payments.filter((pm) => pm.sale_id && oppById.has(pm.sale_id) && inR(pm.legacy_created_on || pm.createdon, b));
  const seen = new Set(), won = [];
  for (const pm of payments) { if (!seen.has(pm.sale_id)) { seen.add(pm.sale_id); won.push(oppById.get(pm.sale_id)); } }
  return { won, payments, rev: sum(payments, (pm) => Number(pm.need_to_pay) || 0), oppById };
}
const PRODUCT_CAT = { 1: "בוסט", 2: "פרימיום", 3: "המשך" };
function productCatMap(d) { return new Map(d.products.map((p) => [p.id, PRODUCT_CAT[p.product_type] || null])); }
function monthBounds(offsetMonths) {
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth() + offsetMonths;
  const first = new Date(y, m, 1); const last = new Date(y, m + 1, 0);
  const iso = (dt) => dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
  return [iso(first), iso(last)];
}

const deltaBox = (cur, prev) => {
  if (prev === null || prev === undefined || prev === 0 || !isFinite(prev)) return '<div class="d flat">אין בסיס להשוואה</div>';
  const p = ((cur - prev) / Math.abs(prev)) * 100;
  const cls = p > 0.5 ? "up" : p < -0.5 ? "down" : "flat";
  const ar = p > 0.5 ? "▲" : p < -0.5 ? "▼" : "●";
  return '<div class="d ' + cls + '">' + ar + " " + Math.abs(p).toFixed(1) + "% מול התקופה הקודמת</div>";
};

  const wonIds = new Set(won.map((o) => o.id));

  const leadCounts = {}, catCounts = {}, catRev = {};

const TEST_PRODUCT_ID = "bf672c30-27ba-4860-8877-241e8c6eba8c";
function premiumCycles(d) {
  const contProd = new Set(d.products.filter((p) => p.product_type === 3 && p.id !== TEST_PRODUCT_ID).map((p) => p.id));
  const firstPay = new Map();
  for (const pm of d.payments) {
    if (!pm.sale_id) continue;
    const dt = dOnly(pm.legacy_created_on || pm.createdon); if (!dt) continue;
    const cur = firstPay.get(pm.sale_id); if (!cur || dt < cur) firstPay.set(pm.sale_id, dt);
  }
  const contByAcc = new Map();
  for (const o of d.opps) {
    if (!o.account_id || !contProd.has(o.product_id)) continue;
    const dt = firstPay.get(o.id); if (!dt) continue;
    if (!contByAcc.has(o.account_id)) contByAcc.set(o.account_id, []);
    contByAcc.get(o.account_id).push(dt);
  }
  const today = todayISO(), out = [];
  for (const c of d.coaching) {
    let end = dOnly(c.premium_end_date);
    if (!end && c.program === 2) { const e = dOnly(c.est_end_date); if (e && e < "2099-01-01") end = e; }
    if (!end) continue;
    const from = addDays(end, -((c.weeks_number || 12) * 7) - 14);
    const conts = (contByAcc.get(c.account_id) || []).filter((x) => x >= from).sort();
    const converted = c.program === 3 || c.program === 4 || conts.length > 0;
    out.push({ c, end, converted, convDate: conts[0] || null, state: converted ? "conv" : end >= today ? "open" : "lost" });
  }
  return out;
}

  const b = f.range === "month" ? monthBounds(0)

    (x.convDate ? heDate(x.convDate) : x.state === "conv" ? '<span class="muted">לא ידוע</span>' : x.state === "open" ? "טרם" : "לא") + "</td><td>" + outcome(x) +

  const listTable = (arr, emptyT, emptyS) => arr.length

    : emptyBox(emptyT, emptyS);
  const upcoming = cyc.filter((x) => x.end >= today), closed = cyc.filter((x) => x.end < today);

  const premiumHTML = `
  <h2 class="page">לוח 4 · ליווי ולקוחות <span>המרת פרימיום להמשך לפי "תאריך סיום פרימיום" בטווח ${rangeTxt}. המרה = רכישת תוכנית המשך אחרי הפרימיום, בלי מגבלת זמן. מסנן המנטורית והטווח חלים על החלק הזה.</span></h2>

    ${kpi("מסיימות פרימיום בטווח", num(cyc.length), "", '<div class="d flat">' + num(closed.length) + " כבר סיימו · " + num(upcoming.length) + " עוד מסיימות בטווח</div>")}

    ${kpi("הסתיימו ללא המשך", num(lost.length), "", '<div class="d flat">תאריך הסיום עבר, אין רכישת המשך</div>')}
  </div>
  <div class="grid">
    ${panel("השוואת מנטוריות · יחס המרה להמשך", "הומרו ÷ מסיימות פרימיום בטווח. \"מובילה\" ו\"מאחור\" מסומנות רק למנטוריות עם 3 סיומים לפחות. לחיצה על שורה מסננת למנטורית.",
      board.length ? '<div class="tw"><table><thead><tr><th>מנטורית</th><th>מסיימות</th><th>הומרו להמשך</th><th>יחס המרה</th></tr></thead><tbody>' +
      board.map((r) => '<tr class="mentor-row" data-mentor="' + esc(r.m) + '" style="cursor:pointer"><td>' + esc(r.m) +
        (r.m === leader ? ' <span class="pill ok">מובילה</span>' : r.m === trailer ? ' <span class="pill crit">מאחור</span>' : "") +
        "</td><td>" + num(r.total) + "</td><td>" + num(r.conv) +

      "</tbody></table></div>" : emptyBox("אין פרימיום שמסתיים בטווח", "הרחב את טווח התאריכים"), "w12")}
    ${single
      ? panel("לקראת סיום · " + esc(single), "סיום פרימיום בטווח, מהיום והלאה", listTable(upcoming, "אין ליוויים לקראת סיום", "אין פרימיום שמסתיים בהמשך הטווח"), "w12") +
        panel("נסגרו · " + esc(single), "סיום פרימיום בטווח, שכבר עבר", listTable(closed, "אין ליוויים שנסגרו", "אין פרימיום שהסתיים בטווח"), "w12")
      : panel("רשימות לפי מנטורית", "", emptyBox("בחרי מנטורית אחת", "סנני למנטורית אחת (או לחצי על שורה בטבלה למעלה) כדי לראות את רשימת \"לקראת סיום\" ו\"נסגרו\""), "w12")}
  </div>`;

  /* ===== תפעול ליווי ===== */
  const active = C.filter((x) => x.status === 2);
  const sent = new Set(d.menus.filter((m) => m.sent_ts || m.msg_sent).map((m) => m.coaching_id));
  const anyMenu = new Set(d.menus.map((m) => m.coaching_id));
  const CUTOVER = "2026-09-13";
  const needMenu = active.filter((x) => x.start_date && x.start_date >= CUTOVER && daysBetween(x.start_date, today) > 2 && !sent.has(x.id));
  const premNoMenu = active.filter((x) => x.start_date && x.start_date >= CUTOVER && x.program === 2 && !anyMenu.has(x.id));
  const hotGroups = d.groups.filter((g) => g.capacity && g.current_count !== null && g.current_count / g.capacity >= 0.9);
  const mentors = uniq(C.map((x) => x.ownername));

  return premiumHTML + `
  <h2 class="page" style="margin-top:28px">תפעול ליווי <span>מקורות: תהליך ליווי (1051), הקצאת תפריט (1059), קבוצת WhatsApp (1068). מסנני מנטורית, מוצר, תוכנית ומחזור חלים על החלק הזה.</span></h2>
  <div class="flags">
    ${flag(needMenu.length ? "crit" : "ok", needMenu.length, "צריכות תפריט וטרם קיבלו", "ליווי פעיל, מעל יומיים מהתחלה, אין חותמת שליחה")}
    ${flag(premNoMenu.length ? "crit" : "ok", premNoMenu.length, "פרימיום ללא הקצאת תפריט כלל", "")}

  <div class="grid">

/* ---------- 5 · תוצאות ומשקל ---------- */
VIEW.res = () => {
  const s = slice(), d = ST.data; const W = s.weighins, C = s.coaching;
  const today = todayISO();
  const byCoach = new Map();
  W.forEach((w) => { const k = w.coaching_id || "?"; const a = byCoach.get(k) || []; a.push(w); byCoach.set(k, a); });
  byCoach.forEach((a) => a.sort((x, y) => (x.week_index || 0) - (y.week_index || 0)));

  const rise = [], stall = [], silent = [];
  byCoach.forEach((a, k) => {
    const co = C.find((c) => c.id === k); if (!co) return;
    const last = a[a.length - 1];
    if (last && Number(last.weight_delta) > 0) rise.push(co);
    const tail = a.slice(-3);
    if (tail.length === 3 && tail.every((x) => Number(x.weight_delta) >= 0)) stall.push(co);
    if (co.status === 2 && last && daysBetween(dOnly(last.weigh_date), today) > 14) silent.push(co);
  });
  const riskIds = new Set([...rise, ...stall].map((c) => c.id));

  const weeks = uniq(W.map((w) => w.week_index)).sort((a, b) => a - b);
  const dw = weeks.map((k) => { const v = avg(W.filter((w) => w.week_index === k), (w) => Number(w.weight_delta)); return v === null ? 0 : Math.abs(Math.min(v, 0)); });
  const jump = dw.length ? weeks[dw.indexOf(Math.max(...dw))] : null;
  const avgDrop = avg(C.filter((c) => c.initial_weight && c.current_weight), (c) => c.initial_weight - c.current_weight);
  const successRate = (() => { const el = C.filter((c) => c.initial_weight && c.current_weight); if (!el.length) return null; return (cnt(el, (c) => (c.initial_weight - c.current_weight) / c.initial_weight >= 0.05) / el.length) * 100; })();
  const persistence = (() => { const el = C.filter((c) => c.weeks_number); if (!el.length) return null; return (avg(el, (c) => Math.min(1, (c.weigh_count || 0) / c.weeks_number)) || 0) * 100; })();
  const mentors = uniq(C.map((c) => c.ownername));
  const byMentor = mentors.map((m) => { const ids = new Set(C.filter((c) => c.ownername === m).map((c) => c.id)); return Math.abs(avg(W.filter((w) => ids.has(w.coaching_id)), (w) => Number(w.change_from_start)) || 0); });

  /* כרטיס לקוחה */
  const q = ST.clientQ.trim();
  const matches = C.filter((c) => !q || String(c.account_name || c.name).includes(q));
  const drillId = ST.drill && matches.some((c) => c.id === ST.drill) ? ST.drill : (matches[0] && matches[0].id);
  const co = C.find((c) => c.id === drillId);
  const series = (byCoach.get(drillId) || []);
  const menusOf = d.menus.filter((m) => m.coaching_id === drillId);
  const lastW = series[series.length - 1];

  const card = !co ? emptyBox("לא נמצאה לקוחה", "נסה שם אחר או נקה את החיפוש") : `
    <div class="client">
      <div class="cl-head"><b>${esc(co.account_name || co.name)}</b>
        <span class="pill ${riskIds.has(co.id) ? "crit" : co.status === 2 ? "ok" : ""}">${riskIds.has(co.id) ? "בסיכון" : esc(co.status_label || EMPTY)}</span>
        <span class="pill">${esc(co.program_label || EMPTY)}</span>
        <span class="pill">${esc(co.ownername || "ללא מנטורית")}</span></div>
      <div class="cl-grid">
        <span><i>משקל התחלה</i><b>${num(co.initial_weight, 1)}</b></span>
        <span><i>משקל נוכחי</i><b>${num(co.current_weight, 1)}</b></span>
        <span><i>יעד</i><b>${num(co.target_weight, 1)}</b></span>
        <span><i>ירידה מצטברת</i><b class="${(co.initial_weight - co.current_weight) > 0 ? "up" : "down"}">${co.initial_weight && co.current_weight ? pct(Math.abs(co.initial_weight - co.current_weight), 1) + " ק״ג" : EMPTY}</b></span>
        <span><i>מרחק מהיעד</i><b>${num(co.distance_to_goal, 1)}</b></span>
        <span><i>שבוע נוכחי</i><b>${num(co.current_week)} / ${num(co.weeks_number)}</b></span>
        <span><i>שקילות</i><b>${num(co.weigh_count)}</b></span>
        <span><i>פגישות</i><b>${num(co.meetings_done)} / ${num(co.meetings_total)}</b></span>
        <span><i>תחילת ליווי</i><b>${heShort(co.start_date)}</b></span>
        <span><i>סיום צפוי</i><b>${co.est_end_date && co.est_end_date !== "2099-12-31" ? heShort(co.est_end_date) : "לא נקבע"}</b></span>
        <span><i>שקילה אחרונה</i><b>${lastW ? heShort(lastW.weigh_date) : EMPTY}</b></span>
        <span><i>שביעות רצון</i><b>${esc(co.satisfaction_label || EMPTY)}</b></span>
        <span><i>קבוצה</i><b>${esc(co.group_name || EMPTY)}</b></span>
        <span><i>תפריטים</i><b>${menusOf.length ? esc(menusOf.map((m) => m.catalog_name || m.name).join(", ")) : "אין הקצאה"}</b></span>
      </div>
    </div>`;

  return `
  <h2 class="page">לוח 5 · תוצאות ומגמות משקל <span>טופס שקילה (1069) כבר מחשב שבוע, שינוי מהשקילה הקודמת וירידה מצטברת ברשומה עצמה.</span></h2>
  <div class="flags">
    ${flag(rise.length ? "crit" : "ok", rise.length, "עלייה במשקל בשקילה האחרונה", "שינוי במשקל > 0")}
    ${flag(stall.length ? "crit" : "ok", stall.length, "קיפאון 3 שקילות ברצף", "לפי מספר שבוע ליווי עוקב, לא תלוי ביום השקילה")}
    ${flag(silent.length ? "warn" : "ok", silent.length, "הפסיקו לדווח מעל 14 יום", "נטישת שקילה בליווי פעיל")}
  </div>
  <div class="kpis">
    ${avgDrop === null ? kpiEmpty("ירידה ממוצעת", "אין משקל התחלה או נוכחי ברשומות") : kpi("ירידה ממוצעת", pct(Math.abs(avgDrop), 1), "ק״ג", '<div class="d flat">על ' + cnt(C, (c) => c.initial_weight && c.current_weight) + " ליוויים</div>")}
    ${successRate === null ? kpiEmpty("שיעור הצלחה", "אין מספיק נתוני משקל") : kpi("שיעור הצלחה מעל 5%", pct(successRate, 0), "%", '<div class="d flat">ירידה של 5% ממשקל ההתחלה</div>')}
    ${kpi("שקילות שדווחו", num(W.length), "", persistence === null ? '<div class="d flat">&nbsp;</div>' : '<div class="d flat">' + pct(persistence, 0) + "% התמדה</div>")}
    ${jump === null ? kpiEmpty("שבוע קפיצת המדרגה", "אין סדרות שקילה") : kpi("שבוע קפיצת המדרגה", num(jump), "", '<div class="d flat">הירידה השבועית הגבוהה ביותר</div>')}
  </div>
  <div class="grid">
    ${panel("מגמת ירידה מצטברת לפי שבוע ליווי", "ירידה בק״ג, AVG(שינוי מצטבר מתחילת הליווי) GROUP BY מספר שבוע ליווי",
      weeks.length ? cv("c_r1", true) : emptyBox("אין סדרות שקילה", W.length + " רשומות שקילה בלבד, הלוח יתמלא כשהשקילות יזרמו"), "w8")}
    ${panel("קפיצת מדרגה, ירידה באותו שבוע", "ירידה בק״ג, AVG(שינוי במשקל)", weeks.length ? cv("c_r2", true) : emptyBox("אין נתונים", "נדרשות לפחות 2 שקילות לאותה לקוחה"), "w4")}
    ${panel("הצלחה לפי מנטורית", "ירידה ממוצעת בק״ג GROUP BY מנטורית", mentors.length && byMentor.some((x) => x > 0) ? cv("c_r3") : emptyBox("אין נתונים", "אין שקילות משויכות למנטוריות"), "w5")}
    ${panel("כרטיס לקוחה",

VIEW.res.after = () => {

    const tr = weeks.map((k) => { const v = avg(W.filter((w) => w.week_index === k), (w) => Number(w.change_from_start)); return v === null ? null : Math.abs(Math.min(v, 0)); });

    const dw = weeks.map((k) => { const v = avg(W.filter((w) => w.week_index === k), (w) => Number(w.weight_delta)); return v === null ? 0 : Math.abs(Math.min(v, 0)); });

  buildNav();

    ST.tab = b.dataset.id; ST.drill = null;

  $("#menuBtn").onclick = () => $("#navWrap").classList.toggle("open");
  $("#filtBtn").onclick = () => $("#filters").classList.toggle("open");
  $("#rangeSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    ST.f.range = b.dataset.r;
    $$("#rangeSeg button").forEach((x) => x.classList.toggle("on", x === b));
    $("#customRange").classList.toggle("hide", ST.f.range !== "custom");
    if (ST.f.range !== "custom") render();
  });
  ["fFrom", "fTo"].forEach((id) => $("#" + id).addEventListener("change", () => { ST.f.from = $("#fFrom").value; ST.f.to = $("#fTo").value; if (ST.f.from && ST.f.to) render(); }));
  $("#resetBtn").onclick = () => { ST.f = { range: "week", from: "", to: "", mentor: [], product: [], source: [], cycle: [], program: [], group: [] }; ST.clientQ = ""; buildFilters(); render(); };
  $("#themeBtn").onclick = () => {
    ST.theme = ST.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = ST.theme; localStorage.setItem("rv_theme", ST.theme);
    $("#themeBtn").textContent = ST.theme === "dark" ? "☾" : "☀"; render();
  };
  $("#logoutBtn").onclick = logout;
  $("#syncBtn").onclick = async function () {
    const b = this; if (b.disabled) return;
    b.disabled = true; const old = b.dataset.label || b.innerHTML; b.dataset.label = old;
    b.innerHTML = '<span class="sp sm"></span> מסנכרן…';
    const done = (t, ms) => { b.innerHTML = t; setTimeout(() => { b.innerHTML = b.dataset.label; b.disabled = false; }, ms || 2200); };
    try {
      const before = (ST.data.sync.log[0] || {}).started_at || "";
      const r = await api("sync");
      if (r.cooldown) return done("המתן " + r.seconds + " שניות", 2600);
      const t0 = Date.now();
      while (Date.now() - t0 < 120000) {
        await new Promise((s2) => setTimeout(s2, 4000));
        const st = await api("syncstatus"); const lg = st.log;
        if (lg && lg.started_at !== before && lg.finished_at) {
          ST.data = await loadData(); buildFilters(); renderStamp(); renderSyncPanel(); render();
          return done(lg.status === "ok" ? "✓ עודכן · " + lg.api_calls + " קריאות" : "✕ סנכרון נכשל", 3200);
        }
      }
      done("עדיין רץ ברקע", 3000);
    } catch (e) { done("✕ שגיאה", 2600); }
  };
  $("#loginForm").addEventListener("submit", (e) => { e.preventDefault(); login($("#pw").value); });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (!ST.data || h === _lastHash) return; readUrl(); buildFilters(); render(); });
  wireMs();
  document.documentElement.dataset.theme = ST.theme;
  $("#themeBtn").textContent = ST.theme === "dark" ? "☾" : "☀";
}

wire();
if (ST.token) { $("#login").classList.add("hide"); boot(); }
</script>
